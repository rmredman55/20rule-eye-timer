<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20/20/20 Eye Strain Timer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --work-color: #3b82f6;
            --break-color: #10b981;
            --delay-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .timer-circle {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 8px solid #334155;
            transition: border-color 0.5s ease;
        }

        .timer-circle.delay-mode {
            border-color: var(--delay-color);
        }

        .timer-circle.work-mode {
            border-color: var(--work-color);
        }

        .timer-circle.break-mode {
            border-color: var(--break-color);
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .mode-status {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-top: 0.25rem;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .volume-slider {
            width: 100px;
            accent-color: var(--work-color);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>20/20/20 Timer</h1>
        <div class="subtitle">Protect your eyes from digital strain</div>

        <div id="timerCircle" class="timer-circle delay-mode">
            <div id="timeDisplay" class="time-display">00:15</div>
            <div id="modeStatus" class="mode-status" style="color: var(--delay-color);">Starting...</div>
        </div>

        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.6">
            <span>🔊</span>
        </div>

        <div class="btn-group">
            <button id="testAudioBtn" class="btn-secondary" onclick="playTestSound()">🎵 Test Ring</button>
        </div>
    </div>

    <script>
        const START_DELAY = 15;
        const WORK_TIME = 20 * 60; 
        const BREAK_TIME = 20;     
        
        let timeLeft = START_DELAY;
        let isBreak = false;
        let isDelayMode = true;
        let timerId = null;
        let audioCtx = null;

        const timeDisplay = document.getElementById('timeDisplay');
        const modeStatus = document.getElementById('modeStatus');
        const timerCircle = document.getElementById('timerCircle');
        const volumeSlider = document.getElementById('volumeSlider');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Simulates an old school high-pitched alarm bell ringing sound
        function playNotificationSound() {
            initAudio();
            if (!audioCtx) return;

            const volumeLevel = parseFloat(volumeSlider.value);
            const now = audioCtx.currentTime;

            // Generate rapid rapid strikes of an alarm bell
            for (let i = 0; i < 8; i++) {
                const strikeTime = now + (i * 0.15);
                
                // Primary high-pitch metallic frequency
                createRingTone(1800, strikeTime, 0.2, volumeLevel);
                // Lower metallic resonance frequency
                createRingTone(1500, strikeTime, 0.2, volumeLevel * 0.7);
            }
        }

        function createRingTone(freq, startTime, duration, baseVolume) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Sine combined with high frequency creates a bright, piercing ringing sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(baseVolume, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playTestSound() {
            initAudio();
            playNotificationSound();
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timeDisplay.textContent = timeString;
            
            let statusLabel = "Starting...";
            if (!isDelayMode) {
                statusLabel = isBreak ? "BREAK!" : "Focus";
            }
            document.title = `(${timeString}) ${statusLabel}`;
        }

        function startTimerLoop() {
            timerId = setInterval(() => {
                timeLeft--;

                if (timeLeft < 0) {
                    if (isDelayMode) {
                        // 15 Second delay finishes, move to Work session
                        isDelayMode = false;
                        isBreak = false;
                        timeLeft = WORK_TIME;
                        
                        modeStatus.textContent = 'Focus';
                        modeStatus.style.color = 'var(--work-color)';
                        timerCircle.className = 'timer-circle work-mode';
                        
                        playNotificationSound();
                    } else {
                        // Switch between Focus and Break loops
                        isBreak = !isBreak;
                        if (isBreak) {
                            timeLeft = BREAK_TIME;
                            modeStatus.textContent = 'Ready for break?';
                            modeStatus.style.color = 'var(--break-color)';
                            timerCircle.className = 'timer-circle break-mode';
                        } else {
                            timeLeft = WORK_TIME;
                            modeStatus.textContent = 'Focus';
                            modeStatus.style.color = 'var(--work-color)';
                            timerCircle.className = 'timer-circle work-mode';
                        }
                        playNotificationSound();
                    }
                }
                updateDisplay();
            }, 1000);
        }

        // Auto-initialize layout and begin countdown seamlessly on window mount
        window.addEventListener('DOMContentLoaded', () => {
            updateDisplay();
            startTimerLoop();
            
            // Audio context can only fully initialize on user gesture, 
            // so we listen to any click inside the document to prime it.
            document.body.addEventListener('click', initAudio, { once: true });
        });
    </script>
</body>
</html>
